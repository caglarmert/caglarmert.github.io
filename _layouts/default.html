<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛰️</text></svg>">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('theme'); } catch (e) {}
      if (stored === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  {% seo %}
</head>
<body>
  {% include nav.html %}
  <main>
    {% unless page.url == '/' %}
      <a class="back-link" href="{{ '/' | relative_url }}">&larr; Back to CV</a>
    {% endunless %}
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author }} &middot;
      <a href="mailto:{{ site.email }}">{{ site.email }}</a> &middot;
      <a href="https://orcid.org/{{ site.orcid_id }}" target="_blank" rel="noopener">ORCID</a> &middot;
      <a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener">LinkedIn</a>
    </p>
  </footer>
  <script>
    (function () {
      var toggle = document.getElementById('theme-toggle');
      if (!toggle) return;
      toggle.addEventListener('click', function () {
        var isLight = document.documentElement.getAttribute('data-theme') === 'light';
        var next = isLight ? 'dark' : 'light';
        if (next === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
